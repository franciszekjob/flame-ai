[project]
name = "flame-ai-sorter"
version = "0.1.0"
description = "Inefficient Sorter demo service for the Flame Graph + AI Interpretation project"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyroscope-io>=0.8.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# K6 TestRun for the slow-flood scenario. Requires the k6-operator to be
# installed (see k6/README.md).
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: slow-flood
  namespace: flame-ai
spec:
  parallelism: 1
  script:
    configMap:
      name: k6-scenarios
      file: slow-flood.js
  arguments: --quiet --no-summary
  runner:
    env:
      - name: BASE_URL
        value: http://sorter.flame-ai.svc.cluster.local
      - name: N
        value: "5000"

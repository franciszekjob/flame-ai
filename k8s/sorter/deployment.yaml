apiVersion: apps/v1
kind: Deployment
metadata:
  name: sorter
  namespace: flame-ai
  labels:
    app.kubernetes.io/name: sorter
    app.kubernetes.io/part-of: flame-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sorter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sorter
        app.kubernetes.io/part-of: flame-ai
    spec:
      containers:
        - name: sorter
          image: flame-ai-sorter:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: sorter-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

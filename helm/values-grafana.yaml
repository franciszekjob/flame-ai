# Grafana values for the flame-ai demo.
# - Pyroscope datasource pre-provisioned
# - grafana-llm-app installed and configured against OpenAI
# - Dashboard sidecar enabled (picks up ConfigMaps labelled grafana_dashboard=1)
# - OpenAI key supplied via the `grafana-llm-secrets` Secret created out-of-band
#   by scripts/create-openai-secret.sh

adminUser: admin
adminPassword: admin

service:
  type: ClusterIP
  port: 80

plugins:
  - grafana-llm-app
  - grafana-pyroscope-app

envFromSecret: grafana-llm-secrets

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Pyroscope
        uid: pyroscope
        type: grafana-pyroscope-datasource
        access: proxy
        url: http://pyroscope.observability.svc.cluster.local:4040
        isDefault: true
        editable: true

# Configure the grafana-llm-app plugin via provisioning. The OPENAI_API_KEY env
# var is injected via envFromSecret above; the plugin reads it through
# secureJsonData substitution.
plugins_provisioning:
  apps.yaml:
    apiVersion: 1
    apps:
      - type: grafana-llm-app
        disabled: false
        jsonData:
          openAI:
            url: https://api.openai.com
            provider: openai
            organizationId: ""
          vector:
            enabled: false
          displayVectorStoreOptions: false
        secureJsonData:
          openAIKey: $OPENAI_API_KEY

# Mount the provisioning YAML into the right path
extraConfigmapMounts:
  - name: grafana-plugins-provisioning
    mountPath: /etc/grafana/provisioning/plugins
    configMap: grafana-plugins-provisioning
    readOnly: true

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    folder: /tmp/dashboards
    provider:
      name: flame-ai
      orgid: 1
      folder: Flame AI
      type: file
      disableDelete: false
      allowUiUpdates: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: flame-ai
        orgId: 1
        folder: Flame AI
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /tmp/dashboards

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

persistence:
  enabled: false

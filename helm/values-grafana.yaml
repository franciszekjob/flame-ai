# Grafana values for the flame-ai demo.
# - Pyroscope datasource pre-provisioned
# - grafana-llm-app routes through the in-cluster LiteLLM proxy, which maps
#   OpenAI model names to gemini-1.5-flash via the Gemini API
# - Dashboard sidecar enabled (picks up ConfigMaps labelled grafana_dashboard=1)
# - Gemini key lives in `gemini-llm-secrets`; LiteLLM reads it directly.
#   `grafana-llm-secrets` carries only a placeholder value for the plugin.

adminUser: admin
adminPassword: admin

service:
  type: ClusterIP
  port: 80

plugins:
  - grafana-llm-app
  - grafana-pyroscope-app

envFromSecret: grafana-llm-secrets

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Pyroscope
        uid: pyroscope
        type: grafana-pyroscope-datasource
        access: proxy
        url: http://pyroscope.observability.svc.cluster.local:4040
        isDefault: true
        editable: true

# Plugin provisioning lives in grafana/provisioning/apps.yaml — loaded into the
# grafana-plugins-provisioning ConfigMap by install-stack.sh / install-stack.ps1.
# Mount the provisioning YAML into the right path
extraConfigmapMounts:
  - name: grafana-plugins-provisioning
    mountPath: /etc/grafana/provisioning/plugins
    configMap: grafana-plugins-provisioning
    readOnly: true

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    folder: /tmp/dashboards
    provider:
      name: flame-ai
      orgid: 1
      folder: Flame AI
      type: file
      disableDelete: false
      allowUiUpdates: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

persistence:
  enabled: false
